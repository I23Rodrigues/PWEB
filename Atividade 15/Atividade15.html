<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 15 - Formulário</title>

    <link rel="stylesheet" href="Atividade15.css">
</head>
<body>

    <h1>Formulário Principal</h1>

    <div class="container">

        <form name="nomeform" onsubmit="return validar()">

            <label>Nome:</label>
            <br>

            <input
                type="text"
                id="nome"
            >

            <br><br>

            <label>Email:</label>
            <br>

            <input
                type="email"
                id="email"
            >

            <br><br>

            <label>Comentário:</label>
            <br>

            <textarea
                id="comentario"
                cols="30"
                rows="5"
            ></textarea>

            <br><br>

            <h3>Pesquisa</h3>

            Primeira vez nesta página?

            <br><br>

            <input
                type="radio"
                name="pesquisa"
                value="sim"
            >
            Sim

            <input
                type="radio"
                name="pesquisa"
                value="nao"
            >
            Não

            <br><br>

            <input
                type="submit"
                value="Enviar"
            >

            <input
                type="reset"
                value="Limpar"
            >

        </form>

    </div>

    <script src="Atividade15.js"></script>

</body>
</html>
