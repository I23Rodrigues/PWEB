<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Atividade 9 - Funções</title>
    <link rel="stylesheet" href="Atividade9.css">
</head>
<body>

<h2>Atividade 9 </h2>


<div class="bloco">
    <h3>1) Maior de três números</h3>
    <input id="n1" type="number" placeholder="Número 1">
    <input id="n2" type="number" placeholder="Número 2">
    <input id="n3" type="number" placeholder="Número 3">
    <button onclick="maiorNumero()">Ver maior</button>
</div>


<div class="bloco">
    <h3>2) Ordem crescente</h3>
    <input id="c1" type="number">
    <input id="c2" type="number">
    <input id="c3" type="number">
    <button onclick="ordemCrescente()">Ordenar</button>
</div>


<div class="bloco">
    <h3>3) Palíndromo</h3>
    <input id="texto" type="text" placeholder="Digite uma palavra ou frase">
    <button onclick="verificarPalindromo()">Verificar</button>
</div>


<div class="bloco">
    <h3>4) Subconjunto</h3>
    <input id="p1" type="text" placeholder="Palavra 1">
    <input id="p2" type="text" placeholder="Palavra 2">
    <button onclick="verificarSubconjunto()">Verificar</button>
</div>


<div class="bloco">
    <h3>5) Dia da semana</h3>
    <input id="data" type="date">
    <button onclick="diaSemana()">Ver dia</button>
</div>

<p id="resultado"></p>

<script src="Atividade9.js"></script>

</body>
</html>
