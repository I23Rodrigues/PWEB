<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 14 - RadioButton</title>

    <link rel="stylesheet" href="Atividade14.css">
</head>
<body>

    <h1>Transformar Texto</h1>

    <div class="container">

        <input 
            type="text"
            id="texto"
            placeholder="Digite um texto"
        >

        <br><br>

        <input 
            type="radio"
            name="opcao"
            onclick="maiusculo()"
        >
        Maiúsculas

        <br><br>

        <input 
            type="radio"
            name="opcao"
            onclick="minusculo()"
        >
        Minúsculas

    </div>

    <script src="Atividade14.js"></script>

</body>
</html>
