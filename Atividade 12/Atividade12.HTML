<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 12 - Objetos</title>
    <link rel="stylesheet" href="Atividade12.css">
</head>
<body>

    <h1>Atividade 12 - JavaScript Objetos</h1>

    <!-- QUESTÃO 1 -->
    <div class="bloco">
        <h2>1 - Retângulo</h2>

        <input type="number" id="base" placeholder="Digite a base">
        <input type="number" id="altura" placeholder="Digite a altura">

        <button onclick="calcularArea()">Calcular Área</button>

        <p id="resultadoRetangulo"></p>
    </div>

    <!-- QUESTÃO 2 -->
    <div class="bloco">
        <h2>2 - Conta Bancária</h2>

        <h3>Conta Corrente</h3>

        <input type="text" id="nomeCorrente" placeholder="Nome do correntista">
        <input type="text" id="bancoCorrente" placeholder="Banco">
        <input type="number" id="numeroCorrente" placeholder="Número da conta">
        <input type="number" id="saldoCorrente" placeholder="Saldo">
        <input type="number" id="saldoEspecial" placeholder="Saldo especial">

        <button onclick="criarContaCorrente()">Criar Conta Corrente</button>

        <p id="resultadoCorrente"></p>

        <hr>

        <h3>Conta Poupança</h3>

        <input type="text" id="nomePoupanca" placeholder="Nome do correntista">
        <input type="text" id="bancoPoupanca" placeholder="Banco">
        <input type="number" id="numeroPoupanca" placeholder="Número da conta">
        <input type="number" id="saldoPoupanca" placeholder="Saldo">
        <input type="number" id="juros" placeholder="Juros (%)">
        <input type="date" id="vencimento">

        <button onclick="criarContaPoupanca()">Criar Conta Poupança</button>

        <p id="resultadoPoupanca"></p>
    </div>

    <script src="Atividade12.js"></script>

</body>
</html>
